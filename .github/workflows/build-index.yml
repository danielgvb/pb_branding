# Rebuilds brand_db/index.json whenever swatch images change, using the GEMINI_API_KEY repo secret.
# Setup: GitHub repo > Settings > Secrets and variables > Actions > New repository secret > GEMINI_API_KEY
name: Build brand index

on:
  push:
    branches: [main]
    paths:
      - "brand_db/**"
      - "!brand_db/index.json"
  workflow_dispatch: {}   # manual run: Actions tab > Build brand index > Run workflow

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build index
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/build_index.py
      - name: Commit index.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add brand_db/index.json
          git diff --cached --quiet || (git commit -m "Rebuild brand index [skip ci]" && git push)
